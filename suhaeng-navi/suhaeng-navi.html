<title>수행 내비</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Do+Hyeon&family=IBM+Plex+Mono:wght@500&family=IBM+Plex+Sans+KR:wght@400;500;700&family=Nanum+Pen+Script&display=swap">
<style>
/* Layout: one narrow column under a sticky tab bar; a plan is drawn as a route line with stops, warnings are highlighter-yellow. */
:root{
  --paper:#F2F5F7; --surface:#FFFFFF; --sunk:#E8EDF0; --ink:#13212C; --muted:#56687A; --line:#D3DCE3;
  --route:#0A8466; --route-ink:#FFFFFF; --route-soft:#D5EFE6;
  --mark:#FFE16A; --warn:#7F5C00; --warn-soft:#FFF3C4; --alert:#BF3F0B; --alert-soft:#FCE5D8;
  --focus:#2563EB;
  --f-display:"Do Hyeon","IBM Plex Sans KR","Apple SD Gothic Neo","Malgun Gothic",system-ui,sans-serif;
  --f-body:"IBM Plex Sans KR","Apple SD Gothic Neo","Malgun Gothic",system-ui,sans-serif;
  --f-num:"IBM Plex Mono",ui-monospace,"SF Mono",Menlo,monospace;
  --r:14px;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --paper:#0D1317; --surface:#151D23; --sunk:#1B252C; --ink:#E3EBF0; --muted:#97A8B5; --line:#283540;
    --route:#3CC69C; --route-ink:#04241A; --route-soft:#133429;
    --mark:#665716; --warn:#E9C75A; --warn-soft:#2E2910; --alert:#FF8B55; --alert-soft:#3A1E12;
    --focus:#7AA7FF; color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --paper:#0D1317; --surface:#151D23; --sunk:#1B252C; --ink:#E3EBF0; --muted:#97A8B5; --line:#283540;
  --route:#3CC69C; --route-ink:#04241A; --route-soft:#133429;
  --mark:#665716; --warn:#E9C75A; --warn-soft:#2E2910; --alert:#FF8B55; --alert-soft:#3A1E12;
  --focus:#7AA7FF; color-scheme:dark;
}
*{box-sizing:border-box}
body{background:var(--paper);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.6;word-break:keep-all;overflow-wrap:anywhere}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--paper)}
p{margin:0}
.shell{max-width:920px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:18px 56px}
.top{display:flex;align-items:center;justify-content:space-between;gap:12px 16px;flex-wrap:wrap;padding-block:6px 14px}
.brand{display:flex;align-items:center;gap:12px;min-width:0}
.brand h1{font-family:var(--f-display);font-weight:400;font-size:34px;line-height:1;margin:0;letter-spacing:-.01em}
.brand p{margin-top:5px;color:var(--muted);font-size:13.5px}
.mk-line{fill:none;stroke:var(--route);stroke-width:4;stroke-linecap:round}
.mk-start{fill:var(--surface);stroke:var(--route);stroke-width:3}
.mk-mid{fill:var(--route)}
.mk-goal{fill:var(--ink)}
.pill{display:inline-flex;align-items:center;gap:7px;font-size:12.5px;padding:4px 11px;border-radius:999px;border:1px solid var(--line);color:var(--muted);background:var(--surface);white-space:nowrap}
.pill i{width:8px;height:8px;border-radius:50%;background:var(--muted)}
.pill.ready i{background:var(--route)}
.pill.off i,.pill.denied i{background:var(--warn)}
.tabs{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--paper);display:flex;gap:2px;overflow-x:auto;border-bottom:1px solid var(--line);margin-bottom:22px;scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tabs button{appearance:none;border:0;background:none;color:var(--muted);font:inherit;font-weight:500;padding:12px 12px 9px;border-bottom:3px solid transparent;cursor:pointer;white-space:nowrap}
.tabs button[aria-current="page"]{color:var(--ink);border-bottom-color:var(--route)}
h2,h3{font-family:var(--f-display);font-weight:400;margin:0;text-wrap:balance;letter-spacing:-.005em}
h2{font-size:25px;line-height:1.2}
h3{font-size:20px;line-height:1.25}
.block{display:flex;flex-direction:column;gap:12px;margin-bottom:32px}
.sec-head{display:flex;align-items:baseline;justify-content:space-between;gap:8px 12px;flex-wrap:wrap}
.eyebrow{font-size:12px;letter-spacing:.06em;color:var(--muted);font-weight:500}
.muted{color:var(--muted)}
.small{font-size:13px}
.num{font-family:var(--f-num);font-variant-numeric:tabular-nums;letter-spacing:-.02em}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px;min-width:0}
.panel.quiet{background:transparent;border-style:dashed;display:flex;flex-direction:column;gap:6px}
.btn{appearance:none;display:inline-flex;align-items:center;justify-content:center;gap:6px;border:1px solid var(--route);background:var(--route);color:var(--route-ink);font:inherit;font-weight:700;font-size:14.5px;padding:8px 16px;border-radius:10px;cursor:pointer;min-height:40px;text-align:center}
.btn.ghost{background:var(--surface);color:var(--ink);border-color:var(--line);font-weight:500}
.btn.small{font-size:13px;padding:4px 11px;min-height:32px}
.btn.danger{background:transparent;color:var(--alert);border-color:var(--line);font-weight:500}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btn:hover:not(:disabled){filter:brightness(1.05)}
.link{appearance:none;border:0;background:none;padding:0;font:inherit;color:var(--route);font-weight:700;cursor:pointer;text-align:left}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.row-end{display:flex;gap:8px;flex-wrap:wrap;justify-content:flex-end;align-items:center}
.chip{display:inline-flex;align-items:center;font-size:12px;font-weight:500;padding:0 8px;border-radius:999px;border:1px solid var(--line);color:var(--muted);white-space:nowrap;line-height:1.75}
.chip.c-alert{background:var(--alert-soft);border-color:transparent;color:var(--alert)}
.chip.c-warn{background:var(--warn-soft);border-color:transparent;color:var(--warn)}
.chip.c-route{background:var(--route-soft);border-color:transparent;color:var(--route)}
.chip.ex{border-style:dashed}
.chipbtn{appearance:none;border:1px solid var(--line);background:var(--surface);color:var(--ink);font:inherit;font-size:13px;padding:3px 11px;border-radius:999px;cursor:pointer}
.chipbtn:hover{border-color:var(--route)}
:focus-visible{outline:2px solid var(--focus);outline-offset:2px}
.err{color:var(--alert);font-size:14px}

/* home */
.banner{display:flex;gap:12px;align-items:flex-start;padding:14px 16px;border-radius:var(--r);background:var(--warn-soft);margin-bottom:12px}
.banner.alert{background:var(--alert-soft)}
.banner .chip{margin-top:2px;background:var(--surface);border-color:transparent;color:var(--warn);font-weight:700}
.banner.alert .chip{color:var(--alert)}
.banner p{margin-top:2px;font-size:14px}
.todo{list-style:none;margin:0;padding:0;display:flex;flex-direction:column}
.todo li{display:grid;grid-template-columns:auto 1fr;gap:2px 12px;padding:10px 0;border-bottom:1px solid var(--line)}
.todo li:last-child{border-bottom:0}
.todo .t-time{font-size:13px;color:var(--muted)}
.todo small{grid-column:2;color:var(--muted);font-size:13px}
.cheer{display:flex;flex-direction:column;gap:4px;padding:12px 14px;background:var(--route-soft);border-radius:10px;margin-bottom:10px}
.cheer p{font-size:15.5px}
.weeks{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:6px}
.week{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:8px;display:flex;flex-direction:column;gap:4px;min-height:118px;min-width:0}
.week.w-warn{background:var(--warn-soft);border-color:transparent}
.week.w-alert{background:var(--alert-soft);border-color:transparent}
.wk-label{font-size:12px;color:var(--muted)}
.wk-count{font-size:12.5px;color:var(--muted)}
.wk-count .num{font-size:22px;font-weight:500;color:var(--ink);margin-right:2px}
.week.w-alert .wk-count .num{color:var(--alert)}
.wk-items{display:flex;flex-direction:column;gap:3px}
.wk-item{appearance:none;border:0;background:var(--surface);color:var(--ink);font:inherit;font-size:12px;border-radius:6px;padding:1px 6px;display:flex;justify-content:space-between;gap:4px;cursor:pointer;text-align:left;min-width:0;white-space:nowrap;overflow:hidden}
.week:not(.w-warn):not(.w-alert) .wk-item{background:var(--sunk)}
.wk-item .num{color:var(--muted)}
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:10px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px;display:flex;flex-direction:column;gap:3px;cursor:pointer;min-width:0}
.card:hover{border-color:var(--route)}
.card-top{display:flex;justify-content:space-between;align-items:center;gap:8px}
.subj{font-size:13px;font-weight:700;color:var(--route)}
.card-title{font-weight:700;font-size:16px;line-height:1.4}
.card-meta{font-size:13px;color:var(--muted)}
.card-foot{font-size:12.5px;color:var(--muted);display:flex;gap:6px;align-items:center;flex-wrap:wrap;margin-top:6px}
details.past summary{cursor:pointer;color:var(--muted);font-size:14px;margin-bottom:10px}

/* detail */
.d-head{display:flex;flex-direction:column;gap:6px;margin:14px 0 26px}
.d-subj{color:var(--route);font-weight:700;display:flex;gap:8px;align-items:center}
.d-title{font-size:30px;line-height:1.2}
.facts{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:10px 18px;margin:10px 0 0}
.facts div{min-width:0}
.facts dt{font-size:12px;color:var(--muted);letter-spacing:.04em}
.facts dd{margin:0;font-weight:500}
.crit{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:10px}
.crit>li{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px;display:flex;flex-direction:column;gap:6px}
.orig{font-size:13px;color:var(--muted)}
.orig b{font-weight:700;margin-right:6px}
.plain{font-weight:700}
.checks{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:6px}
.check{display:flex;gap:10px;align-items:flex-start;cursor:pointer}
.check input{margin:4px 0 0;width:18px;height:18px;accent-color:var(--route);flex:none;cursor:pointer}
.check input:checked + span{color:var(--muted);text-decoration:line-through}
.tip{font-size:13px;background:var(--warn-soft);padding:6px 10px;border-radius:8px}
.before{background:var(--sunk);border-radius:var(--r);padding:14px;display:flex;flex-direction:column;gap:8px}
.orig-list{margin:0;padding-left:20px;display:flex;flex-direction:column;gap:4px}
.plan-sum{display:flex;flex-wrap:wrap;gap:6px 16px;font-size:14px}
.plan-sum b{font-weight:700}
.route{list-style:none;margin:0;padding:0}
.route li{position:relative;display:grid;grid-template-columns:minmax(130px,170px) minmax(0,1fr);gap:2px 14px;padding:10px 0 10px 36px}
.route li::before{content:"";position:absolute;left:10px;top:0;bottom:0;width:4px;background:var(--route)}
.route li:first-child::before{top:19px}
.route li:last-child::before{bottom:calc(100% - 19px)}
.route li.done::before{background:var(--route-soft)}
.route .stop{position:absolute;left:4px;top:12px;width:16px;height:16px;border-radius:50%;background:var(--surface);border:3px solid var(--route)}
.route li.done .stop{background:var(--route)}
.route li.today .stop{box-shadow:0 0 0 5px var(--route-soft)}
.route li.buffer .stop{border-style:dashed;border-color:var(--muted)}
.route li.goal .stop{border-radius:4px;background:var(--ink);border-color:var(--ink)}
.r-when{font-size:13px;color:var(--muted)}
.r-when b{color:var(--ink);font-weight:500}
.r-what{min-width:0}
.r-what small{display:block;color:var(--muted);font-size:13px;margin-left:28px}
.coach-out{white-space:pre-wrap;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px;line-height:1.7}
.coach-out:empty{display:none}
.coach-q{font-size:13px;color:var(--muted)}

/* read */
.drop{border:2px dashed var(--line);border-radius:var(--r);padding:16px;display:flex;flex-direction:column;gap:12px;background:var(--sunk)}
.drop.over{border-color:var(--route)}
.thumbs{display:flex;gap:8px;flex-wrap:wrap}
.thumb{position:relative;width:88px;height:88px;border-radius:10px;overflow:hidden;border:1px solid var(--line);background:var(--surface)}
.thumb img{width:100%;height:100%;object-fit:cover;display:block}
.thumb button{position:absolute;top:4px;right:4px;width:24px;height:24px;border-radius:50%;border:0;background:var(--ink);color:var(--paper);font:inherit;font-size:14px;line-height:1;cursor:pointer}
input:not([type=checkbox]):not([type=file]),textarea{width:100%;font:inherit;color:var(--ink);background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:8px 10px;min-width:0}
textarea{resize:vertical;line-height:1.55}
.fld{display:flex;flex-direction:column;gap:4px;min-width:0}
.lab{font-size:13px;color:var(--muted);font-weight:500}
.fld.unsure input,.fld.unsure textarea{border-color:var(--warn)}
.hl{background:linear-gradient(transparent 42%,var(--mark) 42%);color:var(--ink);font-weight:700;padding:0 2px}
.why{font-size:12.5px;color:var(--warn)}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:12px}
.grid3{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:12px}
.item{display:flex;flex-direction:column;gap:12px}
.busy{display:flex;align-items:center;gap:10px;flex-wrap:wrap;font-size:14px;color:var(--muted)}
.spin{width:16px;height:16px;border:2px solid var(--line);border-top-color:var(--route);border-radius:50%;animation:spin .8s linear infinite;flex:none}
@keyframes spin{to{transform:rotate(360deg)}}

/* time */
.ac{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.ac .ac-label{flex:1 1 140px;width:auto}
.days{display:flex;gap:4px;flex-wrap:wrap}
.day{appearance:none;width:34px;height:34px;border-radius:50%;border:1px solid var(--line);background:var(--surface);color:var(--muted);font:inherit;font-size:13px;cursor:pointer}
.day.on{background:var(--ink);border-color:var(--ink);color:var(--surface)}
.ac-time{display:flex;align-items:center;gap:6px}
.ac-time input{width:auto}
.tp{display:flex;flex-direction:column;gap:8px}
.tp-row,.tp-scale{display:grid;grid-template-columns:62px minmax(0,1fr) 150px;gap:10px;align-items:center;font-size:13px}
.tp-scale{font-size:11px;color:var(--muted)}
.tp-scale div{display:flex;justify-content:space-between}
.tp-track{position:relative;height:18px;background:var(--sunk);border-radius:6px;overflow:hidden}
.tp-track span{position:absolute;top:0;bottom:0}
.seg-free{background:var(--route-soft)}
.seg-busy{background:repeating-linear-gradient(135deg,var(--muted) 0 1.5px,transparent 1.5px 6px);opacity:.55}
.seg-plan{background:var(--route);top:4px!important;bottom:4px!important;border-radius:3px}
.tp-sum{color:var(--muted);font-size:12.5px}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:12.5px;color:var(--muted)}
.legend i{display:inline-block;width:14px;height:10px;border-radius:3px;margin-right:5px;vertical-align:-1px}

/* prompts, accuracy */
.stack{display:flex;flex-direction:column;gap:12px}
.prompt{display:flex;flex-direction:column;gap:10px}
.p-head{display:flex;justify-content:space-between;gap:12px;align-items:flex-start}
.prompt pre{margin:0;white-space:pre-wrap;overflow-wrap:anywhere;font-family:var(--f-body);font-size:13px;line-height:1.6;background:var(--sunk);border-radius:10px;padding:14px;max-height:300px;overflow:auto}
.code{font-family:var(--f-num);background:var(--sunk);padding:0 5px;border-radius:5px;font-size:.92em}
.demo{margin:0;padding-left:22px;display:flex;flex-direction:column;gap:8px}
.acc-sum{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:10px}
.stat{display:flex;flex-direction:column;gap:2px}
.stat .big{font-family:var(--f-num);font-size:30px;line-height:1.1;font-weight:500}
.stat .big small{font-size:15px;color:var(--muted)}
.bars{display:flex;flex-direction:column;gap:8px}
.bar-row{display:grid;grid-template-columns:72px minmax(0,1fr) 54px;gap:10px;align-items:center;font-size:13px}
.bar{height:10px;background:var(--sunk);border-radius:5px;overflow:hidden}
.bar span{display:block;height:100%;background:var(--route)}
.tbl{overflow-x:auto;border:1px solid var(--line);border-radius:var(--r);background:var(--surface)}
table{border-collapse:collapse;width:100%;font-size:13.5px;min-width:540px}
th,td{text-align:left;padding:9px 12px;border-bottom:1px solid var(--line);vertical-align:top}
th{font-weight:500;color:var(--muted);font-size:12.5px}
tr:last-child td{border-bottom:0}

.foot{margin-top:44px;padding-top:16px;border-top:1px solid var(--line);font-size:13px;color:var(--muted);display:flex;flex-direction:column;gap:4px}
.foot strong{color:var(--ink)}
.toast{position:fixed;left:50%;transform:translate(-50%,16px);bottom:calc(18px + env(safe-area-inset-bottom,0px));background:var(--ink);color:var(--paper);padding:10px 16px;border-radius:12px;font-size:14px;opacity:0;pointer-events:none;transition:opacity .2s,transform .2s;max-width:calc(100% - 32px);z-index:20}
.toast.show{opacity:1;transform:translate(-50%,0)}
@media (max-width:600px){
  .weeks{grid-template-columns:repeat(3,minmax(0,1fr))}
  .route li{grid-template-columns:minmax(0,1fr)}
  .d-title{font-size:26px}
  .tp-row,.tp-scale{grid-template-columns:44px minmax(0,1fr)}
  .tp-sum{grid-column:2}
  .tp-scale>span:last-child{display:none}
}
@media (prefers-reduced-motion:reduce){.spin{animation:none}.toast{transition:none}}
</style>

<div class="shell">
  <header class="top">
    <div class="brand">
      <svg width="42" height="42" viewBox="0 0 40 40" aria-hidden="true"><path class="mk-line" d="M8 32 C 8 19, 32 23, 32 9"/><circle class="mk-start" cx="8" cy="32" r="4.5"/><circle class="mk-mid" cx="19.5" cy="21.5" r="3.4"/><rect class="mk-goal" x="27.5" y="3.5" width="9" height="9" rx="2"/></svg>
      <div>
        <h1>수행 내비</h1>
        <p>공지를 읽고, 채점 기준을 풀고, 내 시간에 맞춰 거꾸로 계획해요.</p>
      </div>
    </div>
    <span class="pill" id="ai-pill"><i></i><span>AI 확인 중</span></span>
  </header>
  <nav class="tabs" aria-label="화면">
    <button data-act="tab" data-arg="home">내 수행</button>
    <button data-act="tab" data-arg="read">공지 읽기</button>
    <button data-act="tab" data-arg="time">내 시간</button>
    <button data-act="tab" data-arg="prompts">프롬프트</button>
    <button data-act="tab" data-arg="accuracy">정확도 표</button>
  </nav>
  <main id="view"></main>
  <footer class="foot">
    <p><strong>대신 해주지 않는 AI.</strong> 수행 내비는 감상문·보고서·발표문을 대신 쓰지 않고, 계획과 채점 기준 이해만 도와요.</p>
    <p>입력한 내용은 이 브라우저에만 저장돼요. AI 기능은 링크를 연 사람의 Claude 계정으로 실행되고, 처음 쓸 때 허용을 물어요.</p>
  </footer>
</div>
<div class="toast" id="toast" role="status" aria-live="polite"></div>

<script>
(() => {
'use strict';

const KEY = 'suhaeng-navi:v1';
const WD = ['일','월','화','수','목','금','토'];
const FIELD_LABEL = { subject:'과목', title:'이름', due:'마감일', dueTime:'시간', method:'방식', materials:'준비물', rubric:'채점 기준', weight:'반영 비율' };
const ACC_FIELDS = ['subject','title','due','method','materials','rubric'];
const DEF = { schoolEnd: 990, weekendStart: 600, dayEnd: 1380, cap: 90, weekendCap: 150, travel: 15 };

/* ---------- prompts: the app sends exactly these ---------- */
const P = {
  read: {
    name: '① 공지 정리', when: '공지 사진이나 글을 넣었을 때', tier: '기본 모델 · 사진 첨부',

/* ---------- planner: AI splits the work, this code places it ---------- */
const capFor = date => (isWeekend(date) ? state.settings.weekendCap : state.settings.cap);
function freeIntervals(date, ignoreNow) {
  const st = state.settings, d = dow(date);
  let s = isWeekend(date) ? st.weekendStart : st.schoolEnd;
  const e = st.dayEnd;
  if (!ignoreNow && date === today()) {
    const now = new Date();
    s = Math.max(s, Math.ceil((now.getHours() * 60 + now.getMinutes() + 10) / 10) * 10);
  }
  let iv = s < e ? [[s, e]] : [];
  for (const a of state.academies) {
    if (!a.days.includes(d) || a.end <= a.start) continue;
    const bs = a.start - st.travel, be = a.end + st.travel;
    iv = iv.flatMap(([x, y]) => (be <= x || bs >= y) ? [[x, y]] : [[x, Math.min(y, bs)], [Math.max(x, be), y]].filter(([p, q]) => q - p > 0));
  }
  return iv.filter(([x, y]) => y - x >= 20);
}
function weekCounts() {
  const t = today(), m = {};
  for (const a of state.assessments) {
    if (!a.due || diffDays(t, a.due) < 0) continue;
    (m[mondayOf(a.due)] = m[mondayOf(a.due)] || []).push(a);
  }
  return m;
}
function buildPlans() {
  const t = today();
  const from = state.skipDate === t ? addDays(t, 1) : t;
  const days = {};
  const getDay = date => days[date] || (days[date] = { iv: freeIntervals(date).map(x => x.slice()), left: capFor(date) });
  const capLeft = date => { const g = getDay(date); return Math.min(g.left, g.iv.reduce((n, [s, e]) => n + (e - s), 0)); };
  const wc = weekCounts();
  const plans = {};
  const list = state.assessments.filter(a => a.due && a.steps.length).sort(byDue);
  for (const a of list) {
    const remaining = a.steps.map((s, i) => ({ ...s, i })).filter(s => !s.done);
    const total = remaining.reduce((n, s) => n + s.minutes, 0);
    const p = { blocks: [], start: null, buffer: null, tight: false, unplaced: 0, total, factor: 1.5, usedBuffer: false };
    plans[a.id] = p;
    if (!remaining.length) { p.complete = true; continue; }
    const lastDay = addDays(a.due, -1);
    if (diffDays(from, lastDay) < 0) { p.late = true; p.unplaced = total; continue; }
    let lastWork = addDays(a.due, -2);
    if (diffDays(from, lastWork) < 0) lastWork = lastDay; else p.buffer = lastDay;
    p.factor = (wc[mondayOf(a.due)] || []).length >= 3 ? 2 : 1.5;
    const need = total * p.factor;
    // backward from the deadline: the latest start that still leaves the margin
    let start = lastWork, acc = 0;
    for (let d = lastWork; diffDays(from, d) >= 0; d = addDays(d, -1)) {
      acc += capLeft(d); start = d;
      if (acc >= need) break;
    }
    if (acc < need) p.tight = true;
    p.start = start;
    // forward placement into free time, an even share per day so work is not crammed into the first day
    const order = [];
    for (let d = start; diffDays(d, lastWork) >= 0; d = addDays(d, 1)) order.push(d);
    const workDays = order.length;
    if (p.buffer) order.push(p.buffer);
    const quota = Math.max(30, Math.ceil(total / workDays / 10) * 10);
    const usedHere = {};
    let di = 0;
    for (const s of remaining) {
      let left = s.minutes;
      const parts = [];
      while (left > 0 && di < order.length) {
        const d = order[di], g = getDay(d), min = Math.min(20, left);
        const room = di >= workDays - 1 ? Infinity : quota - (usedHere[d] || 0);
        const k = g.iv.findIndex(([x, y]) => y - x >= min);
        if (g.left < min || k < 0 || room < min) { di++; continue; }
        const [x, y] = g.iv[k];
        let chunk = Math.min(left, g.left, y - x, room);
        const rest = left - chunk;
        if (rest > 0 && rest < 20) {
          // never leave a sitting shorter than 20 minutes
          if (Math.min(left, g.left, y - x) === left) chunk = left;
          else if (chunk - (20 - rest) >= 20) chunk -= 20 - rest;
        }
        parts.push({ date: d, start: x, end: x + chunk, step: s.i, aid: a.id });
        usedHere[d] = (usedHere[d] || 0) + chunk;
        g.left -= chunk; left -= chunk;
        g.iv[k] = [x + chunk + 10, y];
        if (g.iv[k][1] - g.iv[k][0] < 20) g.iv.splice(k, 1);
        if (d === p.buffer) p.usedBuffer = true;
      }
      parts.forEach((b, n) => { b.part = n + 1; b.parts = parts.length; });
      p.blocks.push(...parts);
      p.unplaced += left;
    }
    if (p.unplaced) p.tight = true;
  }
  return plans;
}
const allBlocks = () => Object.values(PLANS).flatMap(p => p.blocks).sort((x, y) => x.date.localeCompare(y.date) || x.start - y.start);

function routeHtml(a, p) {
  const t = today(), rows = [];
  a.steps.forEach((s, i) => {
    if (s.done) rows.push(`<li class="done"><span class="stop"></span><div class="r-when">완료</div><div class="r-what"><label class="check"><input type="checkbox" checked data-act="toggleStep" data-arg="${a.id}:${i}"><span>${esc(s.name)}</span></label></div></li>`);
  });
  p.blocks.forEach(b => {
    const s = a.steps[b.step];
    rows.push(`<li class="${b.date === t ? 'today' : ''}"><span class="stop"></span>
      <div class="r-when num">${md(b.date)} <b>${hm(b.start)}–${hm(b.end)}</b>${b.date === t ? ' <span class="chip c-route">오늘</span>' : ''}</div>
      <div class="r-what"><label class="check"><input type="checkbox" data-act="toggleStep" data-arg="${a.id}:${b.step}"><span>${esc(s.name)}${b.parts > 1 ? ` <span class="muted">(${b.part}/${b.parts})</span>` : ''}</span></label><small>${esc(s.check)}</small></div></li>`);
  });
  if (p.buffer) rows.push(`<li class="buffer"><span class="stop"></span><div class="r-when num">${md(p.buffer)}</div><div class="r-what">${p.usedBuffer ? '예비일 · 시간이 모자라 일부를 넣었어요' : '예비일 · 일부러 비워 둔 날'}</div></li>`);
  rows.push(`<li class="goal"><span class="stop"></span><div class="r-when num">${md(a.due)} ${esc(a.dueTime || '')}</div><div class="r-what"><b>마감</b></div></li>`);
  return `<ol class="route">${rows.join('')}</ol>`;
}
function stepsSection(a) {
  const key = 'steps:' + a.id, p = PLANS[a.id];
  let body;
  if (!a.steps.length) {
    body = `<p class="muted">마감에서 거꾸로 계산할 수 있게 작업을 단계로 나눠요. 날짜는 내 시간 탭의 학원 시간표를 피해서 넣어요.</p>

  } else if (p && p.complete) {
    body = `<div class="panel quiet"><p><b>모든 단계를 끝냈어요.</b> 제출 직전 체크리스트만 한 번 더 보면 돼요.</p></div>${routeHtml(a, p)}`;

    const notes = [];

function renderTimePreview() {
  const box = document.getElementById('time-preview');
  if (!box) return;
  PLANS = buildPlans();
  const t = today(), lo = 480, span = 960;
  const pos = (s, e) => `left:${((clamp(s, lo, lo + span) - lo) / span * 100).toFixed(2)}%;width:${((clamp(e, lo, lo + span) - clamp(s, lo, lo + span)) / span * 100).toFixed(2)}%`;
  const blocks = allBlocks();
  let html = `<div class="tp"><div class="tp-scale"><span></span><div class="num"><span>08</span><span>12</span><span>16</span><span>20</span><span>24</span></div><span></span></div>`;
  for (let i = 0; i < 7; i++) {
    const d = addDays(t, i);
    const free = freeIntervals(d, true);
    const busyIv = state.academies.filter(a => a.days.includes(dow(d)) && a.end > a.start).map(a => [a.start - state.settings.travel, a.end + state.settings.travel]);
    const plan = blocks.filter(b => b.date === d);
    const freeMin = free.reduce((n, [s, e]) => n + e - s, 0), planMin = plan.reduce((n, b) => n + b.end - b.start, 0);
    html += `<div class="tp-row"><span class="num">${i === 0 ? '오늘' : md(d)}</span>
      <div class="tp-track">${free.map(([s, e]) => `<span class="seg-free" style="${pos(s, e)}"></span>`).join('')}${busyIv.map(([s, e]) => `<span class="seg-busy" style="${pos(s, e)}"></span>`).join('')}${plan.map(b => `<span class="seg-plan" style="${pos(b.start, b.end)}" title="${esc(find(b.aid).subject + ' · ' + stepOf(b).name)}"></span>`).join('')}</div>
      <span class="tp-sum">빈 ${dur(freeMin)} · 계획 ${planMin ? dur(planMin) : '없음'}</span></div>`;
  }
  box.innerHTML = html + '</div>';
}

/* accuracy */
function logTSV() {
  const rows = [['번호', '날짜', '입력', '과목', '맞게 읽은 항목', '고친 항목']];
  state.log.forEach((x, i) => rows.push([i + 1, x.at, x.source === 'image' ? '사진' : '글', x.subject, `${ACC_FIELDS.length - x.fixed.length}/${ACC_FIELDS.length}`, x.fixed.map(f => FIELD_LABEL[f]).join(', ') || '없음']));
  return rows.map(r => r.join('\t')).join('\n');
}
function viewAcc() {
  const L = state.log;
  const head = '<div class="sec-head"><h2>정확도 표</h2></div>';
  if (!L.length) {
    return `<section class="block">${head}<div class="panel quiet"><p>아직 기록이 없어요.</p><p class="muted small">공지 읽기에서 AI로 정리한 뒤 저장하면, 학생이 고친 항목을 AI가 틀린 항목으로 세어 여기에 쌓아요. 실제 공지 사진 3~5장으로 시험해 보세요.</p></div></section>`;
  }
  const perfect = L.filter(x => !x.fixed.length).length;
  const totalFields = L.length * ACC_FIELDS.length;
  const okFields = totalFields - L.reduce((n, x) => n + x.fixed.length, 0);
  const photos = L.filter(x => x.source === 'image').length;
  return `<section class="block">${head}
    <p class="muted">AI가 읽은 값을 학생이 고치지 않고 저장하면 맞은 것으로, 고치면 틀린 것으로 세요.</p>
    <div class="acc-sum">
      <div class="panel stat"><span class="eyebrow">고칠 곳 없이 정확</span><span class="big">${perfect}<small> / ${L.length}건</small></span></div>
      <div class="panel stat"><span class="eyebrow">항목 정확도</span><span class="big">${Math.round(okFields / totalFields * 100)}<small>%</small></span></div>
      <div class="panel stat"><span class="eyebrow">입력</span><span class="big">${photos}<small> 사진 · ${L.length - photos} 글</small></span></div>
    </div>
    <div class="panel bars">${ACC_FIELDS.map(f => { const ok = L.filter(x => !x.fixed.includes(f)).length, pct = Math.round(ok / L.length * 100);
      return `<div class="bar-row"><span>${FIELD_LABEL[f]}</span><div class="bar" role="img" aria-label="${FIELD_LABEL[f]} ${pct}%"><span style="width:${pct}%"></span></div><span class="num">${ok}/${L.length}</span></div>`; }).join('')}</div>
    <div class="tbl"><table id="log-table"><thead><tr><th>#</th><th>날짜</th><th>입력</th><th>과목</th><th>맞게 읽음</th><th>고친 항목</th></tr></thead><tbody>
      ${L.map((x, i) => `<tr><td class="num">${i + 1}</td><td class="num">${md(x.at)}</td><td>${x.source === 'image' ? '사진' : '글'}</td><td>${esc(x.subject)}</td><td class="num">${ACC_FIELDS.length - x.fixed.length}/${ACC_FIELDS.length}</td><td>${x.fixed.length ? esc(x.fixed.map(f => FIELD_LABEL[f]).join(', ')) : '<span class="muted">없음</span>'}</td></tr>`).join('')}
    </tbody></table></div>
    <div class="row-end"><button class="btn danger small" data-act="clearLog">${state.confirm === 'log' ? '한 번 더 누르면 기록이 지워져요' : '기록 지우기'}</button><button class="btn ghost small" data-act="copyLog">표 복사</button></div>
  </section>`;
}
const VIEWS = { home: viewHome, read: viewRead, time: viewTime, prompts: viewPrompts, accuracy: viewAcc };

/* ---------- actions ---------- */
function toast(text) {
  const el = $('#toast');
  el.textContent = text;
  el.classList.add('show');
  clearTimeout(toast.t);
  toast.t = setTimeout(() => el.classList.remove('show'), 3400);
}
function arm(key) {
  state.confirm = key;
  render();
  clearTimeout(armTimer);
  armTimer = setTimeout(() => { if (state.confirm === key) { state.confirm = null; render(); } }, 4000);
}
async function copyText(text, el) {
  try { await navigator.clipboard.writeText(text); toast('복사했어요'); }
  catch (e) {
    if (el) { const r = document.createRange(); r.selectNodeContents(el); const s = getSelection(); s.removeAllRanges(); s.addRange(r); }
    toast('복사가 막혀 있어요. 선택된 부분을 직접 복사해 주세요.');
  }
}
function describe(a, withRubric) {
  return [`과목: ${a.subject}`, `이름: ${a.title}`, `오늘: ${todayLabel()}`,
    `마감: ${a.due ? mdLong(a.due) : '미정'}${a.dueTime ? ' ' + a.dueTime : ''}${a.due ? ` (${dday(a.due)})` : ''}`,
    `방식: ${a.method || '공지에 없음'}`, `준비물: ${a.materials.join(', ') || '없음'}`, `반영 비율: ${a.weight || '공지에 없음'}`]
    .concat(withRubric ? ['채점 기준:'].concat(a.rubric.length ? a.rubric.map(r => '- ' + r) : ['- 공지에 없음']) : []).join('\n');
}
function addFiles(list) {
  const max = imageLimits ? imageLimits.maxCount : 5;
  for (const f of Array.from(list || [])) {
    if (!f.type || !f.type.startsWith('image/')) continue;
    if (images.length >= max) { toast(`사진은 ${max}장까지 넣을 수 있어요`); break; }
    images.push({ blob: f, url: URL.createObjectURL(f), name: f.name || '공지 사진' });
  }
  render();
}
function toForm(x) {
  return { subject: x.subject, title: x.title, due: x.due, dueTime: x.dueTime, method: x.method,
           materials: x.materials.join(', '), rubric: x.rubric.join('\n'), weight: x.weight };
}
function setReview(items, source, fallback) {
  state.review = { source, fallback: !!fallback, items: items.map(x => ({ ai: x, f: toForm(x) })) };
  save(); render();
  const el = document.getElementById('review');
  if (el) el.scrollIntoView({ behavior: matchMedia('(prefers-reduced-motion: reduce)').matches ? 'auto' : 'smooth', block: 'start' });
}
async function readNotice() {
  const text = state.readText.trim();
  if (!text && !images.length) { errors.read = '공지 사진을 고르거나 글을 붙여넣어 주세요.'; render(); return; }
  const source = images.length ? 'image' : 'text';
  if (!aiReady()) {
    const onlyExamples = images.every(x => x.ex) && (!text || text === exampleChat().trim());
    if (onlyExamples) {
      const items = [];
      if (images.some(x => x.ex === 'handout')) items.push(fallbackFor('handout'));
      if (text) items.push(fallbackFor('chat'));
      errors.read = null;
      setReview(items, source, true);
      return;
    }
    errors.read = aiOffText();
    render(); return;
  }
  if (images.length && !imageLimits) { errors.read = ERR.images_unavailable; render(); return; }
  const notice = (images.length ? `(공지 사진 ${images.length}장 첨부. 사진 속 공지를 읽어 줘.)\n` : '') + text;
  const prompt = fill(P.read.tpl, { '오늘': todayLabel(), '공지': notice });
  const opts = images.length ? { images: images.map(x => x.blob) } : {};
  const r = await runAI('read', signal => sample.json(prompt, { ...opts, signal }));
  if (!r) return;
  const list = Array.isArray(r) ? r : r && Array.isArray(r.items) ? r.items : [];
  setReview(list.filter(x => x && typeof x === 'object').slice(0, 8).map(cleanItem), source, false);
}
function saveItem(i) {
  const r = state.review, it = r && r.items[+i];
  if (!it) return;
  const f = it.f;
  if (!f.subject.trim() || !f.title.trim() || !/^\d{4}-\d{2}-\d{2}$/.test(f.due)) { it.err = '과목, 이름, 마감일은 꼭 채워 주세요.'; render(); return; }
  const final = { subject: f.subject.trim(), title: f.title.trim(), due: f.due, dueTime: f.dueTime.trim(), method: f.method.trim(),
                  materials: f.materials.split(/[,，]/).map(s => s.trim()).filter(Boolean),
                  rubric: f.rubric.split('\n').map(s => s.trim()).filter(Boolean), weight: f.weight.trim() };
  const a = { id: uid(), source: r.source, checked: {}, checklist: null, steps: [], ...final };
  state.assessments.push(a);
  if (it.ai && !r.fallback && r.source !== 'manual') {
    const same = {
      subject: norm(it.ai.subject) === norm(final.subject), title: norm(it.ai.title) === norm(final.title), due: it.ai.due === final.due,
      method: norm(it.ai.method) === norm(final.method),
      materials: it.ai.materials.map(norm).sort().join('|') === final.materials.map(norm).sort().join('|'),
      rubric: it.ai.rubric.map(norm).join('|') === final.rubric.map(norm).join('|')
    };
    state.log.push({ at: today(), source: r.source, subject: final.subject, fixed: ACC_FIELDS.filter(k => !same[k]) });
  }
  r.items.splice(+i, 1);
  const wk = (weekCounts()[mondayOf(a.due)] || []).length;
  if (!r.items.length) {
    state.review = null; state.readText = '';
    images.splice(0).forEach(x => URL.revokeObjectURL(x.url));
    state.tab = 'home'; state.detail = null;
    try { history.replaceState(null, '', '#home'); } catch (e) { /* hash not writable here */ }
  }
  save(); render();
  if (!state.review) window.scrollTo(0, 0);
  toast(wk >= 3 ? `${a.subject} 저장. ${mdShort(mondayOf(a.due))} 주에 수행평가가 ${wk}개라 몰림 경보가 떴어요.` : `${a.subject} 수행평가를 저장했어요.`);
}

async function skipToday() {
  const t = today();
  const missed = allBlocks().filter(b => b.date === t).map(b => `${find(b.aid).subject} · ${stepOf(b).name} (${hm(b.start)}–${hm(b.end)})`);
  state.skipDate = t;
  PLANS = buildPlans();
  const nx = allBlocks()[0];
  const nextLine = nx ? `${md(nx.date)} ${hm(nx.start)} ${find(nx.aid).subject} · ${stepOf(nx).name} (마감 ${dday(find(nx.aid).due)})` : '';
  state.cheer = { text: `괜찮아요, 하루 쉬어도 계획은 다시 맞춰 놨어요.${nx ? ` ${md(nx.date)} ${hm(nx.start)}에 ${find(nx.aid).subject} ${stepOf(nx).name}부터 이어 가면 돼요.` : ''}`, ai: false };
  save(); render();
  if (!aiReady()) return;
  const prompt = fill(P.cheer.tpl, { '못한일': missed.map(m => '- ' + m).join('\n') || '- 없음', '새일정': nextLine || '남은 일정 없음' });
  const r = await runAI('cheer', signal => sample(prompt, { signal, cache: false, modelTier: 'quick', onText: ({ text }) => {
    const el = document.getElementById('cheer-text');
    if (el) el.textContent = text;
  } }));
  if (r && state.skipDate === t) { state.cheer = { text: r.text.trim(), ai: true }; save(); render(); }
}

/* the example handout, drawn so the photo path can be shown without a real photo */
async function makeHandout() {
  try { await Promise.all([document.fonts.load('700 30px "IBM Plex Sans KR"'), document.fonts.load('400 24px "IBM Plex Sans KR"'), document.fonts.load('40px "Nanum Pen Script"')]); } catch (e) { /* fall back to system faces */ }
  const { W } = anchors();
  const due = addDays(W, 2), dd = parseYmd(due), mo = dd.getMonth() + 1;
  const term = mo >= 8 || mo <= 2 ? 2 : 1, year = mo <= 2 ? dd.getFullYear() - 1 : dd.getFullYear();
  const Wc = 1100, Hc = 1400;
  const c = document.createElement('canvas'); c.width = Wc; c.height = Hc;
  const g = c.getContext('2d');
  const F = '"IBM Plex Sans KR","Apple SD Gothic Neo","Malgun Gothic",sans-serif';
  g.fillStyle = '#7d8379'; g.fillRect(0, 0, Wc, Hc);
  const light = g.createRadialGradient(Wc * 0.35, Hc * 0.25, 80, Wc * 0.5, Hc * 0.5, Wc);
  light.addColorStop(0, 'rgba(255,255,255,0.22)'); light.addColorStop(1, 'rgba(0,0,0,0.28)');
  g.fillStyle = light; g.fillRect(0, 0, Wc, Hc);
  g.save();
  g.translate(Wc / 2, Hc / 2); g.rotate(-0.022); g.translate(-Wc / 2, -Hc / 2);
  const px = 90, py = 70, pw = 920, ph = 1250;
  g.shadowColor = 'rgba(0,0,0,0.35)'; g.shadowBlur = 28; g.shadowOffsetY = 10;
  g.fillStyle = '#fbfaf5'; g.fillRect(px, py, pw, ph);
  g.shadowColor = 'transparent';
  const ink = '#1c1c1c';
  g.fillStyle = ink; g.textAlign = 'center'; g.textBaseline = 'alphabetic';
  g.font = `700 34px ${F}`; g.fillText(`${year}학년도 ${term}학기 과학과 수행평가 안내`, px + pw / 2, py + 82);
  g.font = `400 21px ${F}`; g.fillStyle = '#555'; g.fillText('3학년 · 탐구 보고서', px + pw / 2, py + 120);
  g.textAlign = 'left';
  const row = (y, h, label, value, labelW) => {
    g.fillStyle = '#ebebe6'; g.fillRect(px + 40, y, labelW, h);
    g.strokeStyle = '#333'; g.lineWidth = 1.4; g.strokeRect(px + 40, y, pw - 80, h);
    g.beginPath(); g.moveTo(px + 40 + labelW, y); g.lineTo(px + 40 + labelW, y + h); g.stroke();
    g.fillStyle = ink; g.font = `700 21px ${F}`; g.fillText(label, px + 58, y + h / 2 + 8);
    g.font = `400 22px ${F}`; g.fillText(value, px + 58 + labelW, y + h / 2 + 8);
  };
  const rows = [['평가 영역', '탐구 보고서 (학기 반영 비율 25%)'], ['과제명', '생활 속 산·염기 탐구 보고서'],
    ['제출 기한', `${mo}월 ${dd.getDate()}일(${WD[dd.getDay()]}) 23:59까지`], ['제출 방법', "구글 클래스룸 '수행평가' 과제에 PDF로 업로드"],
    ['분량', 'A4 2쪽 이내 (표지 제외)'], ['준비물', '리트머스 종이(과학실 대여), 실험 과정 사진']];
  let y = py + 160;
  rows.forEach(([l, v]) => { row(y, 60, l, v, 170); y += 60; });
  y += 50;
  g.fillStyle = ink; g.font = `700 25px ${F}`; g.fillText('■ 평가 기준', px + 40, y); y += 22;
  const crit = [['평가 항목', '배점'], ['탐구 문제가 구체적인가', '10'], ['실험 설계와 변인 통제가 적절한가', '15'],
    ['결과를 표 또는 그래프로 1개 이상 분석했는가', '15'], ['결론과 탐구의 한계를 서술했는가', '10'], ['합계', '50']];
  const cw = pw - 80, sw = 130;
  crit.forEach(([k, v], n) => {
    const h = 54;
    if (n === 0 || n === crit.length - 1) { g.fillStyle = '#ebebe6'; g.fillRect(px + 40, y, cw, h); }
    g.strokeStyle = '#333'; g.lineWidth = 1.4; g.strokeRect(px + 40, y, cw, h);
    g.beginPath(); g.moveTo(px + 40 + cw - sw, y); g.lineTo(px + 40 + cw - sw, y + h); g.stroke();
    g.fillStyle = ink; g.font = `${n === 0 || n === crit.length - 1 ? 700 : 400} 21px ${F}`;
    g.fillText(k, px + 58, y + 35);
    g.textAlign = 'center'; g.fillText(v, px + 40 + cw - sw / 2, y + 35); g.textAlign = 'left';
    y += h;
  });
  y += 56;
  g.font = `400 20px ${F}`; g.fillStyle = '#2a2a2a';
  const notes = ['※ 기한이 지난 뒤 제출하면 하루마다 2점 감점합니다.', '※ 다른 사람의 보고서를 베끼거나 AI가 쓴 글을 그대로 내면 0점 처리합니다.', '※ 실험은 보호자와 함께하고 안전 수칙을 지킵니다.'];

  g.strokeStyle = pen; g.lineWidth = 3; g.lineCap = 'round';
  const dateY = py + 160 + 2 * 60 + 30;
  g.beginPath(); g.ellipse(px + 345, dateY, 160, 30, -0.03, 0, Math.PI * 2); g.stroke();
  g.fillStyle = pen; g.font = `42px "Nanum Pen Script", cursive`;
  g.fillText('← 국어 낭송 다음 날!!', px + 530, dateY + 12);
  g.strokeStyle = '#c0392b'; g.lineWidth = 2.5;
  g.beginPath(); g.moveTo(px + 300, aiNoteY + 8); g.lineTo(px + 720, aiNoteY + 6); g.stroke();
  g.restore();
  for (let n = 0; n < 2600; n++) { g.fillStyle = `rgba(0,0,0,${Math.random() * 0.05})`; g.fillRect(Math.random() * Wc, Math.random() * Hc, 1.5, 1.5); }
  return new Promise(res => c.toBlob(res, 'image/jpeg', 0.88));
}

const H = {

    if (images.some(x => x.ex === 'handout')) return;
    const blob = await makeHandout();
    if (!blob) { toast('예시 사진을 만들지 못했어요'); return; }
    images.push({ blob, url: URL.createObjectURL(blob), name: '예시 과학 학습지', ex: 'handout' });
    render();
  },
  exChat() { state.readText = exampleChat(); save(); render(); },
  read() { readNotice(); },
  stop(key) { if (busy[key]) busy[key].ctl.abort(); },
  manualAdd() {
    const blank = { ai: null, f: { subject: '', title: '', due: '', dueTime: '', method: '', materials: '', rubric: '', weight: '' } };
    if (!state.review) state.review = { source: 'manual', fallback: false, items: [] };
    state.review.items.push(blank);
    save(); render();
    const el = document.getElementById(`rf-${state.review.items.length - 1}-subject`);
    if (el) { el.scrollIntoView({ block: 'center' }); el.focus(); }
  },
  closeReview() { state.review = null; save(); render(); },
  saveItem(i) { saveItem(i); },
  dropItem(i) { if (!state.review) return; state.review.items.splice(+i, 1); if (!state.review.items.length) state.review = null; save(); render(); },
  rubricAI(id) { rubricAI(id); },
  stepsAI(id) { stepsAI(id); },
  stepsDefault(id) { stepsDefault(id); },
  coachSend(id) { coachSend(id); },
  coachChip(arg) { const k = arg.indexOf('|'); const id = arg.slice(0, k); (state.coach[id] || (state.coach[id] = { q: '', a: '', asked: '' })).q = arg.slice(k + 1); coachSend(id); },
  del(id) {
    if (state.confirm !== 'del:' + id) { arm('del:' + id); return; }
    state.confirm = null; state.assessments = state.assessments.filter(a => a.id !== id); state.detail = null;
    save(); render(); toast('삭제했어요');
  },
  addAcademy() { state.academies.push({ id: uid(), label: '새 학원', days: [1], start: 1080, end: 1200 }); save(); render(); },
  delAcademy(id) { state.academies = state.academies.filter(a => a.id !== id); save(); render(); },
  toggleDay(arg) {
    const [id, d] = arg.split(':'); const a = state.academies.find(x => x.id === id); if (!a) return;
    const n = +d; a.days = a.days.includes(n) ? a.days.filter(x => x !== n) : a.days.concat(n);
    save(); render();
  },
  copyPrompt(k) { if (P[k]) copyText(P[k].tpl, document.getElementById('pre-' + k)); },
  copyLog() { copyText(logTSV(), document.getElementById('log-table')); },
  clearLog() { if (state.confirm !== 'log') { arm('log'); return; } state.confirm = null; state.log = []; save(); render(); toast('기록을 지웠어요'); },
  resetAll() {
    if (state.confirm !== 'reset') { arm('reset'); return; }
    images.splice(0).forEach(x => URL.revokeObjectURL(x.url));
    Object.assign(state, fresh(), { tab: 'home' });
    save(); render(); window.scrollTo(0, 0); toast('처음 상태로 돌렸어요');
  },
  clearExamples() { state.assessments = state.assessments.filter(a => !a.example); save(); render(); toast('예시를 지웠어요'); }
};

document.addEventListener('click', e => {
  const el = e.target.closest('[data-act]');
  if (!el || el.disabled) return;
  const fn = H[el.dataset.act];
  if (!fn) return;
  if (el.tagName === 'A') e.preventDefault();
  fn(el.dataset.arg || '', el, e);
});
document.addEventListener('keydown', e => {
  if ((e.key === 'Enter' || e.key === ' ') && e.target.matches && e.target.matches('[role="button"][data-act]')) { e.preventDefault(); e.target.click(); }
});
document.addEventListener('input', e => {
  const el = e.target, d = el.dataset || {};
  if (d.bind === 'readText') { state.readText = el.value; save(); }
  else if (d.rf && state.review) { const [i, f] = d.rf.split(':'); const it = state.review.items[+i]; if (it) { it.f[f] = el.value; it.err = null; save(); } }
  else if (d.coach) { (state.coach[d.coach] || (state.coach[d.coach] = { q: '', a: '', asked: '' })).q = el.value; save(); }
  else if (d.ac && d.ac.endsWith(':label')) { const a = state.academies.find(x => x.id === d.ac.split(':')[0]); if (a) { a.label = el.value; save(); } }
});
document.addEventListener('change', e => {
  const el = e.target, d = el.dataset || {};
  if (el.id === 'file') { addFiles(el.files); el.value = ''; return; }
  if (d.set) {
    const k = d.set;
    if (el.type === 'time') { if (el.value) state.settings[k] = toMin(el.value); }
    else {
      const lim = { cap: [30, 240], weekendCap: [30, 360], travel: [0, 60] }[k];
      const n = Number(el.value);
      if (Number.isFinite(n) && lim) state.settings[k] = clamp(Math.round(n), lim[0], lim[1]);
    }
    save(); renderTimePreview();
  } else if (d.ac && !d.ac.endsWith(':label')) {
    const [id, f] = d.ac.split(':'); const a = state.academies.find(x => x.id === id);
    if (a && el.value) { a[f] = toMin(el.value); save(); renderTimePreview(); }
  }
});
document.addEventListener('paste', e => {
  if (state.tab !== 'read' || state.detail) return;
  const files = Array.from((e.clipboardData && e.clipboardData.files) || []).filter(f => f.type.startsWith('image/'));
  if (files.length) { e.preventDefault(); addFiles(files); }
});
document.addEventListener('dragover', e => { const d = e.target.closest && e.target.closest('#drop'); if (d) { e.preventDefault(); d.classList.add('over'); } });
document.addEventListener('dragleave', e => { const d = e.target.closest && e.target.closest('#drop'); if (d && !d.contains(e.relatedTarget)) d.classList.remove('over'); });
document.addEventListener('drop', e => { const d = e.target.closest && e.target.closest('#drop'); if (d) { e.preventDefault(); d.classList.remove('over'); addFiles(e.dataTransfer.files); } });

const h = location.hash.slice(1);
if (VIEWS[h]) { state.tab = h; state.detail = null; }
render();
})();
</script>
